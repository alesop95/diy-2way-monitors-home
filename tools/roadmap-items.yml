# Voci aperte del progetto, fonte unica della roadmap operativa.
#
# Questo file contiene solo ciò che una macchina non può dedurre: quale lavoro resta, dove vive e
# perché. Lo stato misurabile (commit, distanza delle schede da HEAD, esito dei controlli) non si
# scrive qui: lo misura tools/roadmap.py a ogni esecuzione.
#
# Istanziato il 2026-09-30 con MS-167 dal pacchetto roadmap. Le voci vengono da
# docs/PENDING-ACTIONS.md, dalla sezione "Lavoro noto e non fatto" di current-work.md e dal
# runbook di inizializzazione dello stesso giorno. Le voci 1, 2, 3, 4 e 11 sono state tolte il
# 2026-09-30 perché compiute (MS-167, MS-168, MS-169, MS-170): i loro id non si riusano. Il dettaglio del perché di ciascuna resta nel
# documento indicato in `fonte`: qui sta il costo e il passo che la chiude.

titolo: Roadmap operativa di diy-2way-monitors-home

cartella-schede: .claude/context

# I controlli sono quelli della sequenza "Verifica prima di un commit" di CLAUDE.md, più i due
# presidi di memoria arrivati il 2026-09-30.
controlli:
  - nome: convenzione Markdown
    chiave: mdunwrap
    comando: python tools/md-unwrap.py --check .
    filtro: solo-file-tracciati
    rimedio: python tools/md-unwrap.py <file>
  - nome: comandi nei blocchi di shell
    chiave: comandi
    comando: python tools/lint-md-commands.py .
  - nome: fini riga coerenti
    chiave: eol
    comando: python tools/check-eol.py .
  - nome: catena tipografica
    chiave: tipografia
    comando: python tools/test-tipografia.py
  - nome: blocco ambiente propagato al gemello
    chiave: ambiente
    comando: python tools/sync-ambiente.py --check
  - nome: copie dei modelli
    chiave: copie
    comando: python tools/check-copie-modelli.py
  - nome: budget delle istruzioni
    chiave: budget
    comando: python tools/misura-istruzioni.py
  - nome: tabelle Markdown
    chiave: tabelle
    comando: python tools/lint-md-tables.py .
  - nome: wrapper Codex
    chiave: codex
    comando: python tools/sync-codex-skills.py --check
  - nome: lavoro senza traccia in memoria
    chiave: memoria
    comando: python tools/lint-memoria.py
  - nome: affermazioni che invecchiano
    chiave: allineamento
    comando: python tools/Test-Allineamento.py --silenzioso

livelli:
  0: "Minuti, nessuna decisione da prendere"
  1: "Mezz'ora, ancora nessuna decisione di contenuto"
  2: "Sessione dedicata, decisione di contenuto dell'utente"
  3: "Fuori da questo repository, ma è da qui che dipende il resto"

