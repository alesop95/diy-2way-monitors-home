    titolo: Due residui della fase 10 di igiene post-installazione
    stato: Restano la disattivazione dell'autenticazione per password su SSH e la prenotazione dell'indirizzo sul router, entrambe azioni dell'utente e nessuna delle due blocca il progetto.
    passo: Eseguirle a mano e registrarle come microstep con la verifica.
